[build]
  command = "npm run build"
  publish = "dist"

# Keep the existing room database while hosting the website on Netlify.
[[redirects]]
  from = "/api/room"
  to = "https://connected-kabur-bareng.sholahulmufid26.chatgpt.site/api/room"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
